name: Notifications tick

# Sends the push notifications that are due at a given time rather than on an
# action: "sign-ups are open" and "kick-off in 30 minutes" (see
# app/internal/services/notifications.go). The backend runs on Koyeb's free
# instance, which sleeps when idle, so a timer inside it would not fire; this
# schedule calls it instead, waking it if needed.
#
# Every five minutes is the most GitHub allows, and it can run late under
# load. That only delays a notification: each call sends whatever is due and
# not yet sent, and the backend records what it sent, so nothing goes twice.
# Moving to another scheduler (cron-job.org, say) only means pointing it at the
# same URL with the same secret.
#
# Needs, at the repository level (not in the 'production' environment, which
# this job deliberately doesn't use: an environment job is recorded as a
# deployment, 288 times a day):
#   - secret NOTIFICATIONS_TICK_SECRET, the same value Koyeb gets (deploy.yml)
#   - variable BACKEND_URL, the backend's base URL
# Until both exist the job does nothing and says why.
#
# GitHub disables scheduled workflows on a public repository after 60 days
# without activity; re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: notifications-tick
  cancel-in-progress: false

jobs:
  tick:
    name: Send due notifications
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the backend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          TICK_SECRET: ${{ secrets.NOTIFICATIONS_TICK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$BACKEND_URL" ] || [ -z "$TICK_SECRET" ]; then
            echo "::notice::BACKEND_URL or NOTIFICATIONS_TICK_SECRET is not set — nothing to call"
            exit 0
          fi
          # Retries cover a sleeping instance taking a few seconds to wake.
          curl --fail-with-body --silent --show-error \
            --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST -H "Authorization: Bearer $TICK_SECRET" \
            "${BACKEND_URL%/}/internal/notifications/tick"
          echo
