name: Deploy

# Deployment, and nothing else. It lives in its own file for one reason: a job
# is reported as a skipped check even when its `if:` is false, so while these
# two sat in ci.yml every pull request listed "Deploy backend (Koyeb): skipped"
# and "Deploy frontend (Vercel): skipped" next to the jobs that actually ran.
# A PR now lists exactly the three build jobs.
#
# Splitting them out must not weaken the gate, which is why this workflow calls
# ci.yml directly (`uses:` below) instead of reacting to it with a
# `workflow_run` trigger. `workflow_run` fires on *completion*, so it would
# deploy a failed build unless an explicit conclusion check said otherwise;
# `uses:` + `needs:` makes a failing test mechanically unable to reach a deploy
# step, which is the property the old single-file layout had and this keeps.
# It also means the three jobs are defined exactly once, in ci.yml, and master
# runs that same definition rather than a copy free to drift.
#
# The gate is still per-job, not all-or-nothing: ci.yml publishes one output per
# job, and deploy-backend reads only `backend` and `frontend`. A visual
# regression therefore blocks the frontend deploy and leaves the backend one
# alone — there is no reason a screenshot diff should hold up a backend
# rollout, and the visual suite is the one most prone to an infrastructure
# flake. deploy-frontend reads all three.
#
# No `if: github.event_name == 'push'` guard is needed on the jobs any more:
# this workflow only triggers on a push to master, so a pull request (including
# a fork's, which has no access to the production environment's secrets) cannot
# reach it at all.
on:
  push:
    branches: [master]

# Never cancel a deploy in flight: a half-done Docker push or Vercel deploy is
# the one outcome worth avoiding here. Two merges landing close together queue
# instead, in merge order.
concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  # The exact three jobs a PR runs, from the same definition, before anything
  # below is allowed to start.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-backend:
    name: Deploy backend (Koyeb)
    runs-on: ubuntu-latest
    needs: [ci]
    # `always()` so this is evaluated even when the `ci` job as a whole failed,
    # with the two outputs then deciding: a red *visual* job must not block a
    # backend rollout (see the header), but a red backend or frontend job must.
    # Without `always()`, `needs: [ci]` alone would skip this whenever any job
    # in the called workflow failed, visual included.
    if: always() && needs.ci.outputs.backend == 'success' && needs.ci.outputs.frontend == 'success'
    environment: production

    env:
      KOYEB_APP: calciotto
      KOYEB_SERVICE: backend
      KOYEB_REGION: fra
      KOYEB_INSTANCE_TYPE: free
      # The container listens here; Koyeb routes public traffic to it.
      SERVICE_PORT: "8080"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # Repo root: the Dockerfile needs app/, and .dockerignore keeps the
          # context small. Explicit rather than relying on the action's default
          # remote-Git context, so what gets built is what got checked out.
          context: .
          file: ./devops/Dockerfile.prod.backend
          # Koyeb instances are amd64. Building arm64 too would mean emulating
          # the whole Go toolchain under QEMU for an image nothing pulls.
          platforms: linux/amd64
          push: true
          # The commit SHA is the tag actually deployed below: :latest alone is
          # ambiguous (no rollback target, and Koyeb cannot tell one push from
          # the next). :latest is kept only as a human-facing pointer.
          tags: |
            ${{ vars.DOCKERHUB_IMAGE }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install the Koyeb CLI
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      - name: Sync secrets to Koyeb
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SIGNUP_RATE_LIMIT_PER_HOUR: ${{ secrets.SIGNUP_RATE_LIMIT_PER_HOUR }}
          SIGNUP_RATE_LIMIT_BURST: ${{ secrets.SIGNUP_RATE_LIMIT_BURST }}
        run: |
          set -euo pipefail

          # GitHub is the source of truth; Koyeb needs its own copy because the
          # values are read at every container start, not just at deploy time.
          # --value-from-stdin keeps them out of the process argument list.
          # There is no upsert in the CLI, hence update-then-create.
          sync_secret() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::secret $name is empty — set it in the 'production' environment"
              exit 1
            fi
            if printf '%s' "$value" | koyeb secrets update "$name" --value-from-stdin >/dev/null 2>&1; then
              echo "updated secret $name"
            else
              printf '%s' "$value" | koyeb secrets create "$name" --value-from-stdin >/dev/null
              echo "created secret $name"
            fi
          }

          sync_secret DATABASE_URL "$DATABASE_URL"
          sync_secret DATABASE_URL_UNPOOLED "$DATABASE_URL_UNPOOLED"
          sync_secret JWT_SECRET "$JWT_SECRET"

          # Brevo is optional: with no API key the app keeps logging reset links
          # instead of emailing them (see services/mailer.go), which is a
          # degraded but working state rather than a startup failure.
          if [ -n "$BREVO_API_KEY" ]; then
            sync_secret BREVO_API_KEY "$BREVO_API_KEY"
          else
            echo "::warning::BREVO_API_KEY is not set — password-reset and invite emails will only be written to the Koyeb logs"
          fi

          # Signup rate-limit override is optional and normally unset: only
          # needed to loosen the default 5/hour, burst 5 for the duration of a
          # deliberate load test (see main.go's envIntOrDefault). Left unset,
          # the app falls back to its hardcoded default with no warning here —
          # unlike Brevo, there is no degraded-but-working state to call out.
          if [ -n "$SIGNUP_RATE_LIMIT_PER_HOUR" ]; then
            sync_secret SIGNUP_RATE_LIMIT_PER_HOUR "$SIGNUP_RATE_LIMIT_PER_HOUR"
          fi
          if [ -n "$SIGNUP_RATE_LIMIT_BURST" ]; then
            sync_secret SIGNUP_RATE_LIMIT_BURST "$SIGNUP_RATE_LIMIT_BURST"
          fi

      - name: Deploy to Koyeb
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}:${{ github.sha }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
          HAS_BREVO_KEY: ${{ secrets.BREVO_API_KEY != '' }}
          HAS_SIGNUP_RATE_LIMIT_PER_HOUR: ${{ secrets.SIGNUP_RATE_LIMIT_PER_HOUR != '' }}
          HAS_SIGNUP_RATE_LIMIT_BURST: ${{ secrets.SIGNUP_RATE_LIMIT_BURST != '' }}
        run: |
          set -euo pipefail

          if koyeb apps get "$KOYEB_APP" >/dev/null 2>&1; then
            # The app can be left PAUSED by an earlier experiment, in which
            # case a service deployed into it never starts. Resuming an app
            # that is already running is a no-op.
            koyeb apps resume "$KOYEB_APP" >/dev/null 2>&1 || true
          else
            koyeb apps create "$KOYEB_APP"
          fi

          # Shared between the update and create paths so a service that already
          # exists and one being created for the first time get the same config.
          args=(
            --docker "$IMAGE"
            --instance-type "$KOYEB_INSTANCE_TYPE"
            --regions "$KOYEB_REGION"
            --ports "$SERVICE_PORT:http"
            # Root path, not /api: Koyeb passes the route path through
            # unchanged, so a /api prefix would reach Gin as /api/auth/login and
            # match none of its routes. The frontend is on its own domain, so
            # there is nothing to share the path space with anyway.
            --routes "/:$SERVICE_PORT"
            --checks "$SERVICE_PORT:http:/health"
            --env "PORT=$SERVICE_PORT"
            --env GIN_MODE=release
            # @NAME resolves to the Koyeb secret synced in the previous step.
            --env DATABASE_URL=@DATABASE_URL
            --env DATABASE_URL_UNPOOLED=@DATABASE_URL_UNPOOLED
            --env JWT_SECRET=@JWT_SECRET
            --env "CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS"
            --env "FRONTEND_BASE_URL=$FRONTEND_BASE_URL"
            --wait
          )

          if [ "$HAS_BREVO_KEY" = "true" ]; then
            args+=(
              --env BREVO_API_KEY=@BREVO_API_KEY
              --env "BREVO_SENDER_EMAIL=$BREVO_SENDER_EMAIL"
              --env "BREVO_SENDER_NAME=$BREVO_SENDER_NAME"
            )
          fi

          # Signup rate-limit override — see the "Sync secrets to Koyeb" step
          # above. Omitted entirely when unset, so the app's own
          # envIntOrDefault fallback (5/hour, burst 5) applies, exactly as
          # before this override existed.
          if [ "$HAS_SIGNUP_RATE_LIMIT_PER_HOUR" = "true" ]; then
            args+=(--env SIGNUP_RATE_LIMIT_PER_HOUR=@SIGNUP_RATE_LIMIT_PER_HOUR)
          fi
          if [ "$HAS_SIGNUP_RATE_LIMIT_BURST" = "true" ]; then
            args+=(--env SIGNUP_RATE_LIMIT_BURST=@SIGNUP_RATE_LIMIT_BURST)
          fi

          koyeb services update "$KOYEB_APP/$KOYEB_SERVICE" "${args[@]}" \
            || koyeb services create "$KOYEB_SERVICE" --app "$KOYEB_APP" --type web "${args[@]}"

  deploy-frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [ci]
    # Same shape as deploy-backend, plus `visual`: a screenshot regression is a
    # frontend concern, so it gates this deploy and only this one.
    if: always() && needs.ci.outputs.backend == 'success' && needs.ci.outputs.frontend == 'success' && needs.ci.outputs.visual == 'success'
    environment: production

    env:
      # The Vercel CLI reads these two from the environment to know which
      # project it is acting on, instead of an interactive `vercel link`.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          # An empty secret is indistinguishable from a wrong one in the CLI's
          # own error message ("missing a value" only shows up once the flag is
          # already expanded), and a masked empty value looks identical to a
          # masked real one in the log. Fail with the actual cause instead.
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is empty — set it with: gh secret set VERCEL_TOKEN --repo ${{ github.repository }}"
            exit 1
          fi

          # Diagnostic before the real call: "Could not retrieve Project
          # Settings" is what the CLI says both for a token scoped to the wrong
          # account and for a token whose stored value is corrupted, and the
          # log masks the value either way. Listing the teams the token can
          # actually see separates the two. Team names are not secret.
          echo "Teams visible to this token:"
          vercel teams ls --token="$VERCEL_TOKEN" || echo "(teams ls failed — the token is not usable at all)"

          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Inject the API base URL into the build environment
        env:
          VUE_APP_API_BASE_URL: ${{ vars.VUE_APP_API_BASE_URL }}
          # Optional — see api.js's apiTimeoutMs. Normally unset, so the
          # bundle keeps today's hardcoded 10000ms default; only set this
          # (temporarily) to push a deliberate load test past that ceiling
          # and see the backend's real response time under concurrent load.
          VUE_APP_API_TIMEOUT_MS: ${{ vars.VUE_APP_API_TIMEOUT_MS }}
        run: |
          set -euo pipefail

          if [ -z "$VUE_APP_API_BASE_URL" ]; then
            echo "::error::VUE_APP_API_BASE_URL is not set — the bundle would fall back to http://127.0.0.1:8080 and every visitor's browser would call their own machine"
            exit 1
          fi

          # `vercel build` runs the framework build with the environment from
          # .vercel/.env.production.local (what `vercel pull` just wrote), not
          # with this job's arbitrary env vars — so the value is appended there
          # rather than exported. This keeps GitHub the single source of truth
          # instead of duplicating the setting in the Vercel dashboard.
          #
          # Vue CLI only inlines variables prefixed VUE_APP_ into the bundle
          # (see resolveClientEnv.js), which is why the name matters.
          mkdir -p .vercel
          printf '\nVUE_APP_API_BASE_URL=%s\n' "$VUE_APP_API_BASE_URL" >> .vercel/.env.production.local

          if [ -n "$VUE_APP_API_TIMEOUT_MS" ]; then
            printf '\nVUE_APP_API_TIMEOUT_MS=%s\n' "$VUE_APP_API_TIMEOUT_MS" >> .vercel/.env.production.local
          fi

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
