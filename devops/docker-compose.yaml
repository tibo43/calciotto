services:
  backend:
    build:
      context: .
      dockerfile: dockerfile.dev
    ports:
      - 8080:8080
    env_file:
      - env/develop.env
    # Important to bind/mount your codebase dir to /app dir for live reload
    volumes:
      - ./../app:/app
    depends_on:
      db:
        condition: service_healthy
  seed:
    build:
      context: .
      dockerfile: dockerfile.dev
    env_file:
      - env/develop.env
    volumes:
      - ./../app:/app
    # Idempotent: cmd/seed skips itself once players already exist, so
    # running this on every `up` is harmless — it only actually seeds once.
    # Force a fresh reseed with `docker compose exec backend go run ./cmd/seed -reset`.
    command: ["go", "run", "./cmd/seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  frontend:
    image: node:24-alpine
    ports:
      - 4000:4000
    # Important to bind/mount your codebase dir to /frontend dir for live reload
    volumes:
      - ./../frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    working_dir: /frontend
    command: sh -c "npm install && npm run serve"
    environment:
      # 192.168.1.7 rather than 127.0.0.1/localhost: this is baked into the
      # served JS bundle, so it has to be reachable from wherever the browser
      # loading it actually runs — including another device on the LAN
      # (http://192.168.1.7:4000), not just this machine. Still works from
      # this machine too, since 192.168.1.7 loops back to itself. Update if
      # this machine's LAN IP ever changes.
      - VUE_APP_API_BASE_URL=http://192.168.1.7:8080
    depends_on:
      backend:
        condition: service_started
  db:
      image: postgres:17.5
      volumes:
        - ./scripts/init.sh:/docker-entrypoint-initdb.d/init.sh
        - postgres:/var/lib/postgresql/data/pgdata
        - ./configs/postgresql.conf:/etc/postgresql/postgresql.conf
        - ./configs/pg_hba.conf:/etc/postgresql/pg_hba.conf
      ports:
        - "${POSTGRES_PORT}:5432"
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - PGDATA=/var/lib/postgresql/data/pgdata
        - DB_NAME
        - DB_USER
        - DB_PASSWORD
      command: ["--config_file=/etc/postgresql/postgresql.conf", "--hba_file=/etc/postgresql/pg_hba.conf"]
      healthcheck:
        test:
          [
            "CMD-SHELL",
            "pg_isready --username=${DB_USER} --port=${POSTGRES_PORT} --dbname=${DB_NAME}",
          ]
        start_period: 2s
        interval: 5s
        timeout: 5s
        retries: 5
      restart: unless-stopped
volumes:
  postgres:
  frontend_node_modules:
